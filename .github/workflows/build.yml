name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Configure Windows x64
        run: cmake -S . -B build -A x64 -DREDLIGHT_BUILD_PROBE=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Verify tests cannot access display APIs
        shell: pwsh
        run: ./tools/Test-CodeOnlyBinary.ps1
      - name: Run code-only tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify release metadata and generate executable checksum
        shell: pwsh
        run: ./tools/Verify-Release.ps1
      - name: Package portable release
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -C Release -B build/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/Verify-Package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: redlight-windows-x64
          if-no-files-found: error
          path: |
            build/Release/RedLight.exe
            build/Release/RedLight.exe.sha256
            build/packages/*.zip
            build/packages/*.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: redlight-windows-x64
          path: artifacts
      - name: Prepare draft release for review
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/Release/RedLight.exe
            artifacts/Release/RedLight.exe.sha256
            artifacts/packages/*.zip
            artifacts/packages/*.zip.sha256
